services:
  # Backend API Service
  backend:
    build: 
      context: ./Backend/modern_backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/modern_backend/.env
    environment:
      - DEBUG=true
      - CHROMA_TELEMETRY_ENABLED=false
      - LANGCHAIN_TRACING_V2=false
      - LANGCHAIN_ENDPOINT=
    volumes:
      - ./Backend/modern_backend/chroma_new:/app/chroma_new
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - referee-network

  # Frontend Next.js Service
  frontend:
    build: 
      context: ./Frontend/modern-referee-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - referee-network

networks:
  referee-network:
    driver: bridge

volumes:
  chroma_data:
